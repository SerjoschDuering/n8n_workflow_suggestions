<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Redirect to index.html for GitHub Pages single-page applications
    // This handles routes when users refresh or directly access non-root URLs
    const segmentCount = 1; // Adjust based on your repo name (1 for username.github.io/repo-name)
    const location = window.location;
    const repo = location.pathname.split('/').slice(0, 1 + segmentCount).join('/');
    const path = location.pathname.slice(repo.length);
    
    if (path && path !== '/') {
      window.location.replace(`${location.origin}${repo}/?path=${path}`);
    } else {
      window.location.replace(`${location.origin}${repo}/`);
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
